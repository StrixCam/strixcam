# =============================================================================
# release-alpha — the single product workflow that OWNS the `development` branch.
#
# It carries two responsibilities, gated by event type:
#
#   * PULL REQUESTS into `development` run the CI CHECK jobs (`ci-scripts`, `format`,
#     `tidy`, `test`). These four job `name:` values are the REQUIRED STATUS
#     CHECK contexts wired into the branch rulesets (see docs/ci/rulesets.md) —
#     keep them BYTE-IDENTICAL; renaming silently breaks branch protection.
#
#   * PUSHES to `development` (a merge) run the alpha RELEASE job: resolve the next
#     `vX.Y.Z-alpha.N` tag from Conventional Commits, cross-build the aarch64
#     binary inside the devcontainer, and publish it as a PRERELEASE asset.
#
# The check jobs are PR-only (`if: github.event_name == 'pull_request'`) and the
# release job is push/dispatch-only (`if: github.event_name != 'pull_request'`),
# so on any single run exactly one half is active. The release job deliberately
# does NOT `needs:` the check jobs — they are SKIPPED on push, and a `needs:` on a
# skipped job would block the release. The PR's own green checks are the gate.
#
# WHY the devcontainer: the Jetson aarch64 cross-build is only correct inside the
# repo's devcontainer image (gcc-13 aarch64 cross toolchain, the order-sensitive L4T
# sysroot prep scripts under .devcontainer/sysroot/, host-protoc codegen, OpenCV
# SONAME pin, Conan cache). We reuse that image via devcontainers/ci rather than
# re-deriving the toolchain here, so every cross-build gotcha stays solved in
# exactly one place (see CLAUDE.md).
#
# This is the FIRST rung of the SST maturity ladder:
#   alpha  = devcontainer cross-build + container ctest in isolation (here)
#   beta   = the aarch64 binary flashed to a real Jetson + tested with the app
#   stable = shipped (release.yml on main, no rebuild)
#
# The aarch64 cross-build runs HERE on `development`, never on `main` (the R3
# "main never builds" guarantee). Default GITHUB_TOKEN only (contents:write);
# the "Release Tags" ruleset permits creating compliant semver tags.
#
# -----------------------------------------------------------------------------
# !!! KNOWN RISK — VALIDATE ON FIRST RUN !!!
# -----------------------------------------------------------------------------
# The devcontainer base is ubuntu:24.04 and the first build downloads NVIDIA's
# L4T r39.2 BSP + sample rootfs (~3 GB) and assembles the JetPack 7.2 sysroot
# via apply_binaries, then layers ~69 noble -dev .debs (~10-15 min cold, peak
# disk ~15-20 GB). A standard GitHub-HOSTED runner (~14 GB free disk, 6h wall)
# MAY NOT have the headroom; the `free-disk-space` step reclaims ~30 GB first.
# If a job still fails on disk-full / timeout, the remedy is a SELF-HOSTED runner
# that keeps the assembled sysroot + image warm between runs. Re-run with
# `gh run rerun <id> --failed`. Measure peak disk on first run.
# =============================================================================
name: release-alpha

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      version:
        description: "Force base version eg v0.1.0 (seeds vX.Y.Z-alpha.N)"
        required: false
        default: ""
      bump:
        description: "Force base bump level (overrides commit scan)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

# Cancel superseded runs on the same ref to save runner time. A queued dispatch
# tag-and-build is cheaper to let finish than to half-publish, but a superseded
# development push/PR run is safe to cancel.
concurrency:
  group: release-alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Content-hashed devcontainer image. Tag = hash of .devcontainer/** (the full
  # image recipe — Dockerfile + sysroot scripts + noble-deb-urls.txt). Built once
  # per recipe; format/tidy/test/release pull it instead of rebuilding (U1/U2).
  IMAGE: ghcr.io/scoutsporttechnology/sst-cam-firmware-devcontainer

jobs:
  # ===========================================================================
  # image — ensure the content-hashed devcontainer image exists in GHCR, building
  # + pushing ONLY on a cache miss. format/tidy/test (and the release cross-build)
  # `needs:` this job and pull `${IMAGE}:<hash>` rather than each rebuilding the
  # ~3 GB BSP sysroot. A `.devcontainer/**` change is the only thing that triggers
  # a rebuild; everything else is a pull. Fork PRs get a read-only token, so the
  # push is skipped (build-only) — they can neither poison nor benefit (U1, R5).
  # ===========================================================================
  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
    steps:
      # Checkout first (unconditional) so hashFiles('.devcontainer/**') sees the
      # files — without it the hash is empty and the image ref is invalid.
      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute image tag from .devcontainer content
        id: hash
        run: echo "tag=${{ hashFiles('.devcontainer/**') }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        id: login
        continue-on-error: true # fork PRs have a read-only token — fall through to build-only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache check (does ${IMAGE}:<hash> already exist?)
        id: cache
        run: |
          set -euo pipefail
          ref="${IMAGE}:${{ steps.hash.outputs.tag }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "cache hit: ${ref} already published — no build."
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "cache miss: ${ref} will be built."
          fi

      # ---- build-on-miss (heavy; runs only when the recipe changed) ----
      - name: Free up disk space (host)
        if: ${{ steps.cache.outputs.hit == 'false' }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up QEMU (arm64 binfmt for apply_binaries chroot)
        if: ${{ steps.cache.outputs.hit == 'false' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build devcontainer image
        if: ${{ steps.cache.outputs.hit == 'false' }}
        uses: devcontainers/ci@v0.3
        with:
          push: never

      - name: Tag + push to GHCR (skipped on fork / read-only token)
        if: ${{ steps.cache.outputs.hit == 'false' && steps.login.outcome == 'success' }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:${{ steps.hash.outputs.tag }}"
          docker tag sst-cam-firmware "$ref"
          # Tolerate a concurrent first-build race on the same recipe: an identical
          # image under the same content hash is benign last-writer-wins.
          docker push "$ref" || docker manifest inspect "$ref" >/dev/null

  # ===========================================================================
  # changes — detect whether a PR touches build-relevant paths. The EXPENSIVE
  # checks (tidy ~21 min, test ~16 min) gate on `code`; a docs/workflow-only PR
  # skips them. A job SKIPPED by `if:` counts as SUCCESS for required status
  # checks (only a never-reported/pending check blocks the merge), so the wired
  # `tidy`/`test` names stay green on a docs-only PR without running. The cheap
  # checks (ci-scripts 6 s, format 17 s, image 8 s cache-hit) stay always-on.
  # ===========================================================================
  changes:
    name: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter build-relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '.devcontainer/**'
              - 'conanfile.py'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'proto/**'
              - 'scripts/**'
              - '.github/workflows/**'

  # ===========================================================================
  # CI CHECK JOBS — PR-only. The job names below (`ci-scripts`, `format`,
  # `tidy`, `test`) are the REQUIRED STATUS CHECKS wired into the branch
  # rulesets (see docs/ci/rulesets.md) — keep them BYTE-IDENTICAL.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # ci-scripts — gate the shared release version-math script: shellcheck +
  # its own unit-test harness. Host-side only (no devcontainer). This is a
  # SEPARATE job; it must NOT be merged into format/tidy/test, whose names are
  # the wired required status checks.
  # ---------------------------------------------------------------------------
  ci-scripts:
    name: ci-scripts
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck resolve-version + tidy-run + deploy scripts
        run: shellcheck scripts/ci/resolve-version*.sh scripts/ci/tidy-run.sh scripts/ci/test-tidy-run.sh deploy/install.sh deploy/install-test.sh

      - name: resolve-version unit tests
        run: ./scripts/ci/resolve-version-test.sh

      # Selection/sharding self-test for tidy-run.sh (R-SELECT): asserts the
      # shard split covers every TU exactly once and that an unwired TU fails.
      # Host-side (pure bash + the synthetic trees it builds) — no devcontainer.
      - name: tidy-run selection self-test
        run: ./scripts/ci/test-tidy-run.sh

      - name: install.sh runtime-dep contract tests
        run: ./deploy/install-test.sh

  # ---------------------------------------------------------------------------
  # format — clang-format dry-run (Google style, .clang-format) over src/+tests/
  # ---------------------------------------------------------------------------
  format:
    name: format
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # clang-format is a HOST tool — no cross sysroot needed. ubuntu-24.04 ships
      # clang-format-18 (matches the devcontainer's noble clang-format), so run it
      # on the runner directly instead of building/pulling the ~15 GB image.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format-18
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18

      - name: clang-format --dry-run --Werror
        run: |
          set -euo pipefail
          files=$(find src tests \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.cc' -o -name '*.h' \) \
            -not -path '*/_old/*')
          if [ -z "$files" ]; then
            echo "No C++ sources found to format-check"; exit 1
          fi
          echo "$files" | xargs clang-format-18 --dry-run --Werror

  # ---------------------------------------------------------------------------
  # tidy — clang-tidy over the test preset's compile_commands.json, SHARDED.
  #
  # clang-tidy cost scales with TU COUNT: ~95 TUs each re-parse the heavy
  # GStreamer/OpenCV headers, so a single-job full scan is ~21 min flat. We keep
  # FULL-TREE coverage (no diff-scope, no coverage hole — "green = clean tree"
  # stays true) and instead SPLIT the TU list across a runner matrix:
  # `tidy-shard` lints round-robin slices in parallel (scripts/ci/tidy-run.sh),
  # cutting lint wall-time ~Nx, and the `tidy` AGGREGATOR fails iff any shard
  # failed.
  #
  # `tidy` (NOT `tidy-shard`) is the wired REQUIRED STATUS CHECK — a matrix job
  # reports as `tidy-shard (0)`, `tidy-shard (1)`, … which would NOT satisfy the
  # branch ruleset. Keep the aggregator's `name: tidy` byte-identical (see
  # docs/ci/rulesets.md). Bump the shard count by editing BOTH the matrix list
  # and the `4` passed to tidy-run.sh below — they must stay in sync.
  # ---------------------------------------------------------------------------
  tidy-shard:
    name: tidy-shard
    needs: [changes, image]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Hard gate: the cross-toolchain flags (scripts/tidy-args.sh) resolve all
    # std/system headers, the tree is clean, and .clang-tidy promotes every
    # diagnostic to an error via WarningsAsErrors. A new lint violation in ANY
    # shard fails the run. clang-tidy is noble clang-tidy v18 (see .clang-tidy).
    strategy:
      # One shard's violation must not cancel the others — collect every shard's
      # findings in a single run instead of stopping at the first failure.
      fail-fast: false
      matrix:
        # The shard TOTAL is derived from this list via ${{ strategy.job-total }}
        # and passed to tidy-run.sh, so the index and the total can never drift
        # (a hardcoded total is a silent-coverage-hole hazard). Retune by editing
        # this list alone. Entries MUST be the contiguous range 0..N-1 — the
        # round-robin covers bins 0..total-1, and any gap/out-of-range fails
        # CLOSED (tidy-run.sh rejects an index >= total).
        shard: [0, 1, 2, 3]
    steps:
      # Assembling the JetPack 7.2 sysroot (~3GB BSP download + extracted r39.2
      # rootfs + ~69 noble debs) is disk-heavy on a stock hosted runner. Reclaim ~30GB
      # of preinstalled toolchains first. If this still ENOSPCs, a self-hosted
      # runner is required (see header note).
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      # apply_binaries.sh (in 001) chroots into the arm64 rootfs to run dpkg —
      # needs qemu-aarch64 in the host binfmt_misc, else "Exec format error" (126).
      - name: Set up QEMU (arm64 binfmt for apply_binaries chroot)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Make the prebuilt devcontainer image available locally (built once by the
      # `image` job; pulled here, or built locally on pull failure — R6), then run
      # this shard inside it — no per-run sysroot rebuild on the fast path. Run as
      # root so the bind-mounted workspace (owned by the runner uid) is writable
      # for the build dir; the image's PATH already exposes conan + the gcc-13
      # cross toolchain. tidy-run.sh builds (cmake + sst_proto) then lints only
      # this shard's slice.
      - name: Ensure devcontainer image
        uses: ./.github/actions/pull-or-build-devcontainer
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ needs.image.outputs.tag }}

      - name: clang-tidy shard ${{ matrix.shard }} of ${{ strategy.job-total }} (-p build/test)
        env:
          TAG: ${{ needs.image.outputs.tag }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "$PWD":/workspace -w /workspace \
            -v "$HOME/.conan2":/root/.conan2 -e CONAN_HOME=/root/.conan2 \
            -e SHARD="${SHARD}" -e TOTAL="${TOTAL}" \
            "${IMAGE}:${TAG}" bash -lc 'set -euo pipefail; scripts/ci/tidy-run.sh shard "${SHARD}" "${TOTAL}"'

  # ---------------------------------------------------------------------------
  # tidy — AGGREGATOR + floor-NOLINT guard. This is the wired REQUIRED STATUS
  # CHECK (name byte-identical; see docs/ci/rulesets.md). Host-side only — no
  # devcontainer. `if: always()` is load-bearing: a FAILED shard must not
  # skip-propagate through `needs:` and turn this job into a green "skipped"
  # (a job skipped by an unmet `needs:` counts as SUCCESS for required checks).
  # So we run regardless and assert the shard aggregate result ourselves.
  # ---------------------------------------------------------------------------
  tidy:
    name: tidy
    needs: [changes, tidy-shard]
    if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history so the floor-NOLINT guard can diff against the PR base.
          fetch-depth: 0

      # Self-test the guard before trusting it: asserts every bypass class
      # (bare/wildcard/non-leading-list NOLINT, faked marker) is still caught.
      # A regex regression here would silently let unsanctioned floor NOLINTs
      # through the gate.
      - name: Floor-NOLINT guard self-test
        run: scripts/test-check-floor-nolints.sh

      # Cheap, host-side gate — no devcontainer needed. Fails the PR if it adds a
      # bugprone-*/performance-* NOLINT without a `// floor-ok:` sanction marker
      # (see .clang-tidy floor policy). Diff-scoped against the PR base, so only
      # newly introduced suppressions are gated.
      - name: Floor-NOLINT guard (diff-scoped)
        run: scripts/check-floor-nolints.sh "${{ github.event.pull_request.base.sha }}"

      # The merge gate: fail unless EVERY shard succeeded. `needs.tidy-shard.result`
      # is the matrix aggregate — "success" only when all legs passed.
      - name: Assert all tidy shards passed
        run: |
          set -euo pipefail
          result="${{ needs.tidy-shard.result }}"
          echo "tidy-shard aggregate result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::one or more tidy shards did not pass (${result})"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # test — cross-build the test preset and run GTest under qemu (ctest)
  # ---------------------------------------------------------------------------
  test:
    name: test
    needs: [changes, image]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Assembling the JetPack 7.2 sysroot (~3GB BSP download + extracted r39.2
      # rootfs + ~69 noble debs) is disk-heavy on a stock hosted runner. Reclaim ~30GB
      # of preinstalled toolchains first. If this still ENOSPCs, a self-hosted
      # runner is required (see header note).
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      # apply_binaries.sh (in 001) chroots into the arm64 rootfs to run dpkg —
      # needs qemu-aarch64 in the host binfmt_misc, else "Exec format error" (126).
      - name: Set up QEMU (arm64 binfmt for apply_binaries chroot)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Make the prebuilt devcontainer image available locally (pull, or build
      # locally on pull failure — R6), then run the cross-build + ctest inside it —
      # no per-run sysroot rebuild on the fast path. ctest runs the aarch64 GTest
      # binaries under qemu (host binfmt from setup-qemu-action); QEMU_LD_PREFIX
      # points the emulator at the L4T targetfs for shared libs. Hardware-bound
      # tests (real IMX477 / BlueZ / radio / live GStreamer) fail in the cross
      # container — see CLAUDE.md — so the known names are excluded by -E.
      # DURABLE FIX (firmware owner): tag them `LABELS hardware` + switch to -LE.
      - name: Ensure devcontainer image
        uses: ./.github/actions/pull-or-build-devcontainer
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ needs.image.outputs.tag }}

      - name: cmake test preset + build + ctest (qemu)
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "$PWD":/workspace -w /workspace \
            -v "$HOME/.conan2":/root/.conan2 -e CONAN_HOME=/root/.conan2 \
            -e QEMU_LD_PREFIX=/l4t/targetfs \
            "${IMAGE}:${TAG}" bash -lc '
              set -euo pipefail
              cmake --preset test
              cmake --build --preset test
              ctest --preset test --output-on-failure \
                -E "CaptureSingleFrameAndLog|AdvertisesOnRealBluez|FormsAutonomousGroupOwner|HttpServesByteRangeWithBearerToken"'

  # ===========================================================================
  # ALPHA RELEASE JOBS — push/dispatch-only. NOT gated behind the check jobs:
  # the checks are SKIPPED on push, so a `needs:` on them would block release.
  # The PR's own green checks (run above on the PR) are the gate.
  # ===========================================================================
  resolve:
    name: resolve alpha version
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.ver.outputs.released }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve next alpha tag (conventional-commit aware)
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump }}
        run: ./scripts/ci/resolve-version.sh alpha

  build-and-upload:
    name: cross-build alpha binary
    needs: [resolve, image]
    if: ${{ github.event_name != 'pull_request' && needs.resolve.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release asset
      packages: read # pull the prebuilt devcontainer image
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      # Reclaim ~30GB so the JetPack base image + L4T sysroot fit on a hosted
      # runner (else ENOSPC). Self-hosted runner needed if this still fails.
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # apply_binaries.sh (in 001) chroots into the arm64 rootfs to run dpkg —
      # needs qemu-aarch64 registered in the host's binfmt_misc, or the chroot
      # fails with "Exec format error" (exit 126). Hosted runners don't register
      # it by default; Docker Desktop does, which is why local builds pass.
      - name: Set up QEMU (arm64 binfmt for apply_binaries chroot)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Make the prebuilt devcontainer image available locally (pull, or build
      # locally on pull failure — R6), then run the release cross-build inside it —
      # no per-run sysroot rebuild on the fast path. The binary lands in the
      # bind-mounted build/ on the host for the staging step below.
      - name: Ensure devcontainer image
        uses: ./.github/actions/pull-or-build-devcontainer
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ needs.image.outputs.tag }}

      - name: cmake release preset + build
        env:
          IMG_TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "$PWD":/workspace -w /workspace \
            -v "$HOME/.conan2":/root/.conan2 -e CONAN_HOME=/root/.conan2 \
            "${IMAGE}:${IMG_TAG}" bash -lc '
              set -euo pipefail
              cmake --preset release
              cmake --build --preset release
              test -x build/release/bin/sst_cam_firmware'

      - name: Stage versioned asset
        id: asset
        run: |
          set -euo pipefail
          asset="sst_cam_firmware-${TAG}-aarch64"
          cp build/release/bin/sst_cam_firmware "${asset}"
          echo "path=${asset}" >> "$GITHUB_OUTPUT"

      # Atomic publish: create the prerelease AND attach the binary in ONE step.
      # softprops creates the Release+tag if missing. Splitting create-then-upload
      # let a cancel between the two leave a dangling asset-less immutable tag,
      # bricking the alpha line for this base — so this is deliberately one step.
      - name: Publish alpha prerelease (create + attach binary, atomic)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
