# =============================================================================
# release-alpha — the single product workflow that OWNS the `development` branch.
#
# It carries two responsibilities, gated by event type:
#
#   * PULL REQUESTS into `development` run the CI CHECK jobs (`ci-scripts`, `format`,
#     `tidy`, `test`). These four job `name:` values are the REQUIRED STATUS
#     CHECK contexts wired into the branch rulesets (see docs/ci/rulesets.md) —
#     keep them BYTE-IDENTICAL; renaming silently breaks branch protection.
#
#   * PUSHES to `development` (a merge) run the alpha RELEASE job: resolve the next
#     `vX.Y.Z-alpha.N` tag from Conventional Commits, cross-build the aarch64
#     binary inside the devcontainer, and publish it as a PRERELEASE asset.
#
# The check jobs are PR-only (`if: github.event_name == 'pull_request'`) and the
# release job is push/dispatch-only (`if: github.event_name != 'pull_request'`),
# so on any single run exactly one half is active. The release job deliberately
# does NOT `needs:` the check jobs — they are SKIPPED on push, and a `needs:` on a
# skipped job would block the release. The PR's own green checks are the gate.
#
# WHY the devcontainer: the Jetson aarch64 cross-build is only correct inside the
# repo's devcontainer image (gcc-13 aarch64 cross toolchain, the order-sensitive L4T
# sysroot prep scripts under .devcontainer/sysroot/, host-protoc codegen, OpenCV
# SONAME pin, Conan cache). We reuse that image via devcontainers/ci rather than
# re-deriving the toolchain here, so every cross-build gotcha stays solved in
# exactly one place (see CLAUDE.md).
#
# This is the FIRST rung of the SST maturity ladder:
#   alpha  = devcontainer cross-build + container ctest in isolation (here)
#   beta   = the aarch64 binary flashed to a real Jetson + tested with the app
#   stable = shipped (release.yml on main, no rebuild)
#
# The aarch64 cross-build runs HERE on `development`, never on `main` (the R3
# "main never builds" guarantee). Default GITHUB_TOKEN only (contents:write);
# the "Release Tags" ruleset permits creating compliant semver tags.
#
# -----------------------------------------------------------------------------
# !!! KNOWN RISK — VALIDATE ON FIRST RUN !!!
# -----------------------------------------------------------------------------
# The devcontainer base is ubuntu:24.04 and the first build downloads NVIDIA's
# L4T r39.2 BSP + sample rootfs (~3 GB) and assembles the JetPack 7.2 sysroot
# via apply_binaries, then layers ~69 noble -dev .debs (~10-15 min cold, peak
# disk ~15-20 GB). A standard GitHub-HOSTED runner (~14 GB free disk, 6h wall)
# MAY NOT have the headroom; the `free-disk-space` step reclaims ~30 GB first.
# If a job still fails on disk-full / timeout, the remedy is a SELF-HOSTED runner
# that keeps the assembled sysroot + image warm between runs. Re-run with
# `gh run rerun <id> --failed`. Measure peak disk on first run.
# =============================================================================
name: release-alpha

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      version:
        description: "Force base version eg v0.1.0 (seeds vX.Y.Z-alpha.N)"
        required: false
        default: ""
      bump:
        description: "Force base bump level (overrides commit scan)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

# Cancel superseded runs on the same ref to save runner time. A queued dispatch
# tag-and-build is cheaper to let finish than to half-publish, but a superseded
# development push/PR run is safe to cancel.
concurrency:
  group: release-alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ===========================================================================
  # CI CHECK JOBS — PR-only. The job names below (`ci-scripts`, `format`,
  # `tidy`, `test`) are the REQUIRED STATUS CHECKS wired into the branch
  # rulesets (see docs/ci/rulesets.md) — keep them BYTE-IDENTICAL.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # ci-scripts — gate the shared release version-math script: shellcheck +
  # its own unit-test harness. Host-side only (no devcontainer). This is a
  # SEPARATE job; it must NOT be merged into format/tidy/test, whose names are
  # the wired required status checks.
  # ---------------------------------------------------------------------------
  ci-scripts:
    name: ci-scripts
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck resolve-version scripts
        run: shellcheck scripts/ci/resolve-version*.sh

      - name: resolve-version unit tests
        run: ./scripts/ci/resolve-version-test.sh

  # ---------------------------------------------------------------------------
  # format — clang-format dry-run (Google style, .clang-format) over src/+tests/
  # ---------------------------------------------------------------------------
  format:
    name: format
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # Assembling the JetPack 7.2 sysroot (~3GB BSP download + extracted r39.2
      # rootfs + ~69 noble debs) is disk-heavy on a stock hosted runner. Reclaim ~30GB
      # of preinstalled toolchains first. If this still ENOSPCs, a self-hosted
      # runner is required (see header note).
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: clang-format --dry-run --Werror
        uses: devcontainers/ci@v0.3
        with:
          # Build the devcontainer locally per run — no ghcr imageName/cacheFrom.
          # ghcr image caching needs registry login + push perms and was failing
          # at `docker tag ... ghcr.io/...`; deferred as an optimization. Each run
          # rebuilds the image (sysroot unpack ~13 min, observed to fit the runner).
          runCmd: |
            set -euo pipefail
            files=$(find src tests \
              \( -name '*.cpp' -o -name '*.hpp' -o -name '*.cc' -o -name '*.h' \) \
              -not -path '*/_old/*')
            if [ -z "$files" ]; then
              echo "No C++ sources found to format-check"; exit 1
            fi
            echo "$files" | xargs clang-format --dry-run --Werror

  # ---------------------------------------------------------------------------
  # tidy — clang-tidy over a configured preset's compile_commands.json
  # ---------------------------------------------------------------------------
  tidy:
    name: tidy
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # Hard gate: the cross-toolchain flags (scripts/tidy-args.sh) resolve all
    # std/system headers, the tree is clean, and .clang-tidy promotes every
    # diagnostic to an error via WarningsAsErrors. A new lint violation fails the
    # PR. clang-tidy is noble clang-tidy v18 (see .clang-tidy).
    steps:
      # Assembling the JetPack 7.2 sysroot (~3GB BSP download + extracted r39.2
      # rootfs + ~69 noble debs) is disk-heavy on a stock hosted runner. Reclaim ~30GB
      # of preinstalled toolchains first. If this still ENOSPCs, a self-hosted
      # runner is required (see header note).
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history so the floor-NOLINT guard can diff against the PR base.
          fetch-depth: 0

      # Self-test the guard before trusting it: asserts every bypass class
      # (bare/wildcard/non-leading-list NOLINT, faked marker) is still caught.
      # A regex regression here would silently let unsanctioned floor NOLINTs
      # through the gate below.
      - name: Floor-NOLINT guard self-test
        run: scripts/test-check-floor-nolints.sh

      # Cheap, host-side gate — no devcontainer needed. Fails the PR if it adds a
      # bugprone-*/performance-* NOLINT without a `// floor-ok:` sanction marker
      # (see .clang-tidy floor policy). Diff-scoped against the PR base, so only
      # newly introduced suppressions are gated.
      - name: Floor-NOLINT guard (diff-scoped)
        run: scripts/check-floor-nolints.sh "${{ github.event.pull_request.base.sha }}"

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: clang-tidy (-p build/test)
        uses: devcontainers/ci@v0.3
        with:
          # Build the devcontainer locally per run — no ghcr imageName/cacheFrom.
          # ghcr image caching needs registry login + push perms and was failing
          # at `docker tag ... ghcr.io/...`; deferred as an optimization. Each run
          # rebuilds the image (sysroot unpack ~13 min, observed to fit the runner).
          runCmd: |
            set -euo pipefail
            # Configure the test preset to generate compile_commands.json.
            cmake --preset test
            # Generate the protobuf headers (bluetooth.pb.h / wifi.pb.h) before
            # tidy. clang-tidy does not build — without this the generated
            # headers are absent, every TU that includes them hits
            # clang-diagnostic-error 'bluetooth.pb.h not found', and the broken
            # AST yields a cascade of phantom findings (members "can be made
            # static", spurious easily-swappable, etc.). Building just sst_proto
            # runs protoc only — seconds, not the full cross-build.
            cmake --build --preset test --target sst_proto
            files=$(find src tests \
              \( -name '*.cpp' -o -name '*.cc' \) \
              -not -path '*/_old/*')
            if [ -z "$files" ]; then
              echo "No C++ translation units found to tidy"; exit 1
            fi
            # Cross-toolchain flags live in scripts/tidy-args.sh — the single
            # source of truth shared with scripts/fix.sh so the two can't drift.
            # shellcheck source=scripts/tidy-args.sh
            source scripts/tidy-args.sh
            # No blanket --warnings-as-errors='*' here: the repo's .clang-tidy
            # decides severity via WarningsAsErrors.
            echo "$files" | xargs clang-tidy -p build/test "${TIDY_EXTRA_ARGS[@]}"

  # ---------------------------------------------------------------------------
  # test — cross-build the test preset and run GTest under qemu (ctest)
  # ---------------------------------------------------------------------------
  test:
    name: test
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # Assembling the JetPack 7.2 sysroot (~3GB BSP download + extracted r39.2
      # rootfs + ~69 noble debs) is disk-heavy on a stock hosted runner. Reclaim ~30GB
      # of preinstalled toolchains first. If this still ENOSPCs, a self-hosted
      # runner is required (see header note).
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: cmake test preset + build + ctest (qemu)
        uses: devcontainers/ci@v0.3
        with:
          # Build the devcontainer locally per run — no ghcr imageName/cacheFrom.
          # ghcr image caching needs registry login + push perms and was failing
          # at `docker tag ... ghcr.io/...`; deferred as an optimization. Each run
          # rebuilds the image (sysroot unpack ~13 min, observed to fit the runner).
          # Hardware-bound tests (real IMX477 / BlueZ / radio / live GStreamer)
          # are expected to fail in the cross-compile container — see CLAUDE.md.
          # They are NOT yet tagged with a CTest LABEL, so we exclude the known
          # hardware-bound test names by regex (-E) here.
          # DURABLE FIX (firmware owner): add `set_tests_properties(... PROPERTIES
          # LABELS hardware)` (or a gtest naming convention) and switch this to
          # `ctest -LE hardware`, so new hardware tests are excluded automatically.
          runCmd: |
            set -euo pipefail
            cmake --preset test
            cmake --build --preset test
            QEMU_LD_PREFIX=/l4t/targetfs ctest --preset test --output-on-failure \
              -E 'CaptureSingleFrameAndLog|AdvertisesOnRealBluez|FormsAutonomousGroupOwner|HttpServesByteRangeWithBearerToken'

  # ===========================================================================
  # ALPHA RELEASE JOBS — push/dispatch-only. NOT gated behind the check jobs:
  # the checks are SKIPPED on push, so a `needs:` on them would block release.
  # The PR's own green checks (run above on the PR) are the gate.
  # ===========================================================================
  resolve:
    name: resolve alpha version
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.ver.outputs.released }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve next alpha tag (conventional-commit aware)
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump }}
        run: ./scripts/ci/resolve-version.sh alpha

  build-and-upload:
    name: cross-build alpha binary
    needs: resolve
    if: ${{ github.event_name != 'pull_request' && needs.resolve.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      # Reclaim ~30GB so the JetPack base image + L4T sysroot fit on a hosted
      # runner (else ENOSPC). Self-hosted runner needed if this still fails.
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: cmake release preset + build
        uses: devcontainers/ci@v0.3
        with:
          # Build the devcontainer locally — no ghcr imageName/cacheFrom (needs
          # registry login + push perms; was failing at `docker tag ghcr.io/...`).
          # Deferred caching optimization.
          runCmd: |
            set -euo pipefail
            cmake --preset release
            cmake --build --preset release
            test -x build/release/bin/sst_cam_firmware

      - name: Stage versioned asset
        id: asset
        run: |
          set -euo pipefail
          asset="sst_cam_firmware-${TAG}-aarch64"
          cp build/release/bin/sst_cam_firmware "${asset}"
          echo "path=${asset}" >> "$GITHUB_OUTPUT"

      # Atomic publish: create the prerelease AND attach the binary in ONE step.
      # softprops creates the Release+tag if missing. Splitting create-then-upload
      # let a cancel between the two leave a dangling asset-less immutable tag,
      # bricking the alpha line for this base — so this is deliberately one step.
      - name: Publish alpha prerelease (create + attach binary, atomic)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          prerelease: true
          files: ${{ steps.asset.outputs.path }}
          fail_on_unmatched_files: true
