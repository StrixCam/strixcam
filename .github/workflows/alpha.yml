# =============================================================================
# alpha — on every push to `develop` (a merge), resolve the next
# `vX.Y.Z-alpha.N` tag from Conventional Commits, cross-build the aarch64
# binary inside the devcontainer, and publish it as a PRERELEASE Release asset.
#
# This is the FIRST rung of the SST maturity ladder:
#   alpha  = devcontainer cross-build + container ctest in isolation (here)
#   beta   = the aarch64 binary flashed to a real Jetson + tested with the app
#   stable = shipped (promote.yml on main, no rebuild)
#
# Skips cleanly when only docs/chore/ci/test/refactor landed since the last
# stable tag (resolve-version.sh -> released=false). workflow_dispatch is a
# manual override (carries IN_VERSION/IN_BUMP for deterministic seeding).
#
# The aarch64 cross-build runs HERE on `develop`, never on `main` (the R3
# "main never builds" guarantee). Default GITHUB_TOKEN only (contents:write);
# the "Release Tags" ruleset permits creating compliant semver tags.
#
# KNOWN RISK (same as ci.yml): the JetPack devcontainer build is heavy and can
# flake on hosted runners (disk/image-pull). Re-run with `gh run rerun <id>
# --failed`; a self-hosted runner is the durable fix.
# =============================================================================
name: alpha

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      version:
        description: "Force base version eg v0.1.0 (seeds vX.Y.Z-alpha.N)"
        required: false
        default: ""
      bump:
        description: "Force base bump level (overrides commit scan)"
        type: choice
        options: ["", patch, minor, major]
        default: ""

# Cancel a superseded develop push, but never a dispatch (a queued tag-and-build
# is cheaper to let finish than to half-publish).
concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve:
    name: resolve alpha version
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.ver.outputs.released }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve next alpha tag (conventional-commit aware)
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump }}
        run: scripts/ci/resolve-version.sh alpha

  build-and-upload:
    name: cross-build alpha binary
    needs: resolve
    if: needs.resolve.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      # Reclaim ~30GB so the JetPack base image + L4T sysroot fit on a hosted
      # runner (else ENOSPC). Self-hosted runner needed if this still fails.
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: cmake release preset + build
        uses: devcontainers/ci@v0.3
        with:
          # Build the devcontainer locally — no ghcr imageName/cacheFrom (needs
          # registry login + push perms; was failing at `docker tag ghcr.io/...`).
          # Deferred caching optimization.
          runCmd: |
            set -euo pipefail
            cmake --preset release
            cmake --build --preset release
            file build/release/bin/sst_cam_firmware
            test -x build/release/bin/sst_cam_firmware

      - name: Stage versioned asset
        id: asset
        run: |
          set -euo pipefail
          asset="sst_cam_firmware-${TAG}-aarch64"
          cp build/release/bin/sst_cam_firmware "${asset}"
          echo "path=${asset}" >> "$GITHUB_OUTPUT"

      - name: Create alpha prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --target "$GITHUB_SHA" \
            --title "${TAG}" \
            --prerelease \
            --generate-notes

      - name: Upload binary to the alpha prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ steps.asset.outputs.path }}
          fail_on_unmatched_files: true
